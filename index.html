<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drohnen-Telemetrie</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg stroke='%23111' stroke-width='2' stroke-linecap='round'%3E%3Cline x1='9' y1='9' x2='23' y2='23'/%3E%3Cline x1='23' y1='9' x2='9' y2='23'/%3E%3C/g%3E%3Cg fill='none' stroke='%23111' stroke-width='1.6'%3E%3Ccircle cx='6.5' cy='6.5' r='4.2'/%3E%3Ccircle cx='25.5' cy='6.5' r='4.2'/%3E%3Ccircle cx='6.5' cy='25.5' r='4.2'/%3E%3Ccircle cx='25.5' cy='25.5' r='4.2'/%3E%3C/g%3E%3Crect x='12.5' y='12.5' width='7' height='7' rx='1.5' fill='%23111'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root { --ink: #111; --text: #4a4a4a; --muted: #8c8c8c; --line: #e8e8e8; --g1: #D9D9D9; --g2: #BDBDBD; --ui: "Outfit", "Segoe UI", system-ui, sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; overflow-x: hidden; }
  body { overflow-x: hidden; font-family: var(--ui); font-weight: 400; line-height: 1.5; color: var(--text); min-height: 100vh; padding-bottom: 90px;
    background: linear-gradient(90deg, var(--g1) 50%, #fff 50%) fixed; font-variant-numeric: tabular-nums; }
  button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
  a { color: inherit; }

  /* ---------- Bühne: schwebende Karte ---------- */
  .stage { position: relative; width: min(1180px, calc(100% - 48px)); margin: 48px auto 0; background: #fff; border-radius: 16px;
    box-shadow: 0 60px 140px rgba(0,0,0,.18), 0 14px 40px rgba(0,0,0,.07); display: grid; grid-template-columns: 2fr 1fr; min-height: 720px; }
  .main { position: relative; overflow: hidden; display: flex; flex-direction: column; padding: 118px 48px 0 56px; min-width: 0; }
  .side { background: var(--g2); border-radius: 0 16px 16px 0; display: flex; align-items: flex-end; justify-content: flex-end; padding: 28px; }
  .drone { position: absolute; z-index: 3; top: 96px; left: calc(66.667% - 21%); width: 42%; pointer-events: none; filter: drop-shadow(0 40px 36px rgba(0,0,0,.28)); animation: hover 5s ease-in-out infinite; }
  @keyframes hover { 0%,100% { transform: translateY(0) rotate(-1.5deg); } 50% { transform: translateY(-14px) rotate(1.5deg); } }
  .prop { transform-box: fill-box; transform-origin: center; animation: spin .5s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Navigation */
  nav { position: absolute; z-index: 6; top: 26px; left: 40px; right: 40px; display: flex; align-items: center; gap: 28px; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.01em; color: var(--ink); text-decoration: none; }
  .menu { display: flex; gap: 24px; margin-left: 12px; }
  .menu a { color: var(--muted); text-decoration: none; font-size: .95rem; font-weight: 500; padding: 4px 0; border-bottom: 2px solid transparent; transition: color .2s; }
  .menu a:hover { color: var(--ink); }
  .menu a.on { color: var(--ink); border-color: var(--ink); }
  .tools { margin-left: auto; display: flex; align-items: center; gap: 6px; position: relative; }
  .ic { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; color: var(--ink); transition: background .2s; }
  .ic:hover, .ic.on { background: rgba(0,0,0,.08); }
  .ic svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #q { width: 0; opacity: 0; border: 0; padding: 0; font: inherit; font-size: .9rem; color: var(--ink); background: rgba(255,255,255,.7); border-radius: 999px; outline: none; transition: width .3s, opacity .2s, padding .3s; }
  #q.open { width: 180px; opacity: 1; padding: 8px 14px; }
  .pop { position: absolute; top: 48px; right: 0; width: 230px; background: #fff; border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.2); padding: 6px; display: none; z-index: 10; }
  .pop.open { display: block; }
  .pop button, .pop label { display: block; width: 100%; text-align: left; padding: 10px 12px; border-radius: 8px; font-size: .92rem; color: var(--ink); cursor: pointer; }
  .pop button:hover, .pop label:hover { background: #f3f3f3; }
  .pop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
  .pop .del { color: #6b6b6b; }

  /* Hero */
  .wm { position: absolute; z-index: 0; left: 28px; top: 78px; font-size: clamp(8rem, 18vw, 17rem); font-weight: 800; letter-spacing: -.05em; line-height: 1; color: #f2f2f2; user-select: none; pointer-events: none; }
  .hero { position: relative; z-index: 1; max-width: 560px; }
  h1 { font-size: clamp(2.6rem, 5.2vw, 4.4rem); font-weight: 800; letter-spacing: -.04em; line-height: 1; color: var(--ink); }
  .subline { margin-top: 16px; font-size: 1.1rem; color: var(--muted); max-width: 34ch; font-weight: 300; }
  .actions { margin-top: 28px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .btn-o { display: inline-block; padding: 13px 28px; border: 1.5px solid var(--ink); border-radius: 999px; font-weight: 600; font-size: .95rem; color: var(--ink); cursor: pointer; transition: background .2s, color .2s; }
  .btn-o:hover { background: var(--ink); color: #fff; }
  .link { font-size: .92rem; font-weight: 500; color: var(--muted); text-decoration: underline; text-underline-offset: 4px; }
  .link:hover { color: var(--ink); }
  #msg { margin-top: 14px; min-height: 1.3em; font-size: .85rem; color: var(--muted); max-width: 52ch; }
  #msg.err { color: var(--ink); font-weight: 600; }

  /* Flug-Slider */
  .slider { position: relative; z-index: 1; display: flex; align-items: center; gap: 8px; margin-top: 34px; max-width: 640px; }
  .thumbs { display: flex; gap: 18px; overflow-x: auto; scroll-snap-type: x proximity; padding: 8px 4px 6px; scrollbar-width: none; }
  .thumbs::-webkit-scrollbar { display: none; }
  .th { flex: none; scroll-snap-align: start; display: flex; flex-direction: column; align-items: center; gap: 7px; width: 70px; }
  .th .c { width: 58px; height: 58px; border-radius: 50%; background: #f5f5f5; border: 2px solid #e2e2e2; display: grid; place-items: center; transition: transform .2s, border-color .2s, box-shadow .2s; }
  .th:hover .c { transform: translateY(-3px); }
  .th.on .c { border-color: var(--ink); background: #fff; box-shadow: 0 8px 22px rgba(0,0,0,.18); }
  .th svg { width: 40px; height: 40px; }
  .th .n { font-size: .74rem; font-weight: 500; color: var(--muted); max-width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .th.on .n { color: var(--ink); font-weight: 600; }
  .arrow { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; color: var(--muted); font-size: .85rem; }
  .arrow:hover { color: var(--ink); border-color: var(--ink); }
  .none { font-size: .95rem; color: var(--muted); padding: 10px 0; }

  /* Stat-Leiste */
  .statbar { position: relative; z-index: 1; margin-top: auto; display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--line); }
  .st { padding: 24px 18px 28px; border-left: 1px solid var(--line); min-width: 0; }
  .st:first-child { border-left: 0; padding-left: 0; }
  .st .v { font-size: clamp(1.6rem, 2.7vw, 2.4rem); font-weight: 700; letter-spacing: -.03em; color: var(--ink); line-height: 1.1; white-space: nowrap; }
  .st .v small { font-size: .85rem; font-weight: 500; color: var(--muted); margin-left: 4px; letter-spacing: 0; }
  .st .k { margin-top: 6px; font-size: .68rem; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .st .d { margin-top: 2px; font-size: .72rem; color: var(--muted); min-height: 1em; }

  /* CTA im grauen Panel */
  .cta { position: relative; z-index: 4; display: flex; align-items: center; justify-content: space-between; gap: 22px; width: min(100%, 260px); padding: 22px 24px; background: #2b2b2b; color: #fff; border-radius: 12px; text-decoration: none; font-weight: 600; box-shadow: 0 16px 40px rgba(0,0,0,.28); transition: transform .2s, background .2s; }
  .cta:hover { background: #000; transform: translateY(-3px); }
  .cta small { display: block; font-weight: 300; font-size: .75rem; color: #bbb; margin-bottom: 2px; }
  .cta .ar { width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.5); display: grid; place-items: center; font-size: 1.1rem; transition: transform .2s; }
  .cta:hover .ar { transform: translateX(4px); }

  /* ---------- Weitere Karten ---------- */
  .cards { width: min(1180px, calc(100% - 48px)); margin: 36px auto 0; display: grid; gap: 18px; }
  .card { background: #fff; border-radius: 16px; box-shadow: 0 24px 70px rgba(0,0,0,.1), 0 6px 18px rgba(0,0,0,.04); scroll-margin-top: 24px; }
  .card > summary { list-style: none; cursor: pointer; display: flex; align-items: baseline; gap: 16px; padding: 24px 64px 24px 32px; position: relative; border-radius: 16px; }
  .card > summary::-webkit-details-marker { display: none; }
  .card > summary:hover { background: #fafafa; }
  .card .ttl { font-size: 1.25rem; font-weight: 700; letter-spacing: -.02em; color: var(--ink); }
  .card .hint { font-size: .9rem; color: var(--muted); font-weight: 300; }
  .card > summary::after { content: ""; position: absolute; right: 34px; top: 50%; width: 9px; height: 9px; margin-top: -7px; border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink); transform: rotate(45deg); transition: transform .25s; }
  .card[open] > summary::after { transform: rotate(-135deg); margin-top: -2px; }
  .fold-body { padding: 4px 32px 34px; border-top: 1px solid var(--line); }
  .fold-body > *:first-child { margin-top: 24px; }
  .sublabel { margin: 30px 0 10px; font-size: .72rem; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .note { font-size: .86rem; color: var(--muted); margin-top: 14px; max-width: 80ch; }

  .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .tab { padding: 8px 18px; border-radius: 999px; border: 1px solid var(--line); font-size: .88rem; font-weight: 500; color: var(--muted); transition: .2s; }
  .tab:hover { color: var(--ink); border-color: var(--ink); }
  .tab.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .chartbox { position: relative; height: 350px; }
  .row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; }
  select { font: inherit; font-size: .9rem; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; outline: none; }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: right; padding: 13px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; font-size: .92rem; }
  th:first-child, td:first-child { text-align: left; }
  th { font-size: .68rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  td { color: var(--ink); }
  td.best { font-weight: 700; }
  td.worst { color: var(--muted); text-decoration: underline dotted; text-underline-offset: 4px; }
  .scrollx { overflow-x: auto; }
  .sw { display: inline-block; width: 22px; height: 0; border-top: 3px solid var(--c); margin-right: 10px; vertical-align: middle; }
  .sw.dash { border-top-style: dashed; }

  .who { font-size: .72rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }
  .who b { color: var(--ink); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .tile { padding: 20px 22px; border: 1px solid var(--line); border-radius: 12px; }
  .tile .k { font-size: .68rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .tile .v { font-size: 2.1rem; font-weight: 700; letter-spacing: -.03em; color: var(--ink); line-height: 1.2; margin-top: 4px; }
  .tile .v small { font-size: .85rem; font-weight: 500; color: var(--muted); margin-left: 4px; }
  .tile .d { font-size: .78rem; color: var(--muted); margin-top: 2px; min-height: 1.1em; }
  .tile .gauge { height: 4px; margin-top: 12px; background: #eee; border-radius: 4px; overflow: hidden; }
  .tile .gauge b { display: block; height: 100%; background: var(--ink); border-radius: 4px; }
  .verdict { margin-top: 16px; padding: 14px 18px; background: #f7f7f7; border-radius: 10px; border-left: 3px solid var(--g2); color: var(--text); }
  .verdict b { color: var(--ink); }
  .verdict.warn { border-left-color: #777; }
  .verdict.bad { border-left-color: var(--ink); background: #efefef; }

  .recs { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .rec { padding: 22px; border: 1px solid var(--line); border-radius: 12px; }
  .rec h4 { font-size: 1rem; font-weight: 700; letter-spacing: -.01em; color: var(--ink); }
  .rec .sub2 { font-size: .8rem; color: var(--muted); }
  .rec .top { margin: 14px 0 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .rec .big { font-size: 2rem; font-weight: 700; letter-spacing: -.03em; color: var(--ink); }
  .rec .big small { font-size: .85rem; color: var(--muted); font-weight: 500; }
  .badge { font-size: .62rem; font-weight: 700; letter-spacing: .14em; padding: 3px 10px; background: var(--ink); color: #fff; border-radius: 999px; }
  .rank { display: grid; grid-template-columns: 62px 1fr 80px; gap: 10px; align-items: center; font-size: .82rem; padding: 3px 0; }
  .rank .nm { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rank .nm.sel { color: var(--ink); font-weight: 600; }
  .rank .track { height: 6px; background: #eee; border-radius: 6px; overflow: hidden; }
  .rank .track b { display: block; height: 100%; border-radius: 6px; }
  .rank .val { text-align: right; color: var(--muted); }
  .rank.win .val { color: var(--ink); font-weight: 700; }

  .empty { padding: 60px 20px; text-align: center; color: var(--muted); }
  .rowact button { padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); font-size: .8rem; color: var(--muted); margin-left: 6px; }
  .rowact button:hover { color: var(--ink); border-color: var(--ink); }
  .chk { width: 18px; height: 18px; accent-color: var(--ink); cursor: pointer; }

  dialog { margin: auto; border: 0; padding: 30px; width: min(420px, calc(100vw - 32px)); background: #fff; color: var(--text); border-radius: 16px; box-shadow: 0 40px 120px rgba(0,0,0,.35); }
  dialog::backdrop { background: rgba(0,0,0,.35); backdrop-filter: blur(3px); }
  dialog h3 { color: var(--ink); font-size: 1.2rem; font-weight: 700; letter-spacing: -.02em; margin-bottom: 8px; }
  dialog label { display: block; font-size: .68rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-top: 16px; }
  dialog input { display: block; width: 100%; margin-top: 6px; font: inherit; font-size: 1rem; color: var(--ink); background: #fff; border: 1px solid #d5d5d5; border-radius: 10px; padding: 11px 14px; outline: none; }
  dialog input:focus { border-color: var(--ink); }
  .dbtns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 26px; }
  .dbtns button { padding: 11px 24px; border-radius: 999px; font-weight: 600; border: 1.5px solid var(--ink); }
  .dbtns button.primary { background: var(--ink); color: #fff; }
  #over { position: fixed; inset: 0; z-index: 100; display: none; place-items: center; background: rgba(255,255,255,.85); backdrop-filter: blur(4px); font-size: 1.6rem; font-weight: 700; color: var(--ink); letter-spacing: -.02em; }
  #over.on { display: grid; }

  @media (max-width: 900px) {
    body { background: var(--g1); }
    .stage { grid-template-columns: 1fr; margin-top: 16px; width: calc(100% - 24px); }
    .main { padding: 96px 22px 0; }
    .side { border-radius: 0 0 16px 16px; min-height: 300px; align-items: flex-end; justify-content: center; }
    .drone { position: relative; top: auto; left: auto; width: min(360px, 80%); margin: 10px auto -20px; }
    .side { flex-direction: column; justify-content: space-between; align-items: center; padding-bottom: 20px; }
    .cta { width: 100%; }
    nav { left: 18px; right: 18px; gap: 14px; }
    .menu { display: none; }
    .statbar { grid-template-columns: repeat(2, 1fr); }
    .st, .st:first-child { padding: 18px 12px 18px 0; border-left: 0; border-bottom: 1px solid var(--line); }
    .wm { font-size: 7rem; top: 90px; }
    .cards { width: calc(100% - 24px); }
    .card > summary { flex-wrap: wrap; gap: 2px 14px; padding: 20px 52px 20px 22px; }
    .fold-body { padding: 4px 20px 26px; }
    .chartbox { height: 280px; }
  }
  @media (prefers-reduced-motion: reduce) { .drone, .prop { animation: none; } html { scroll-behavior: auto; } }
</style>
</head>
<body>

<div class="stage" id="top">
  <nav>
    <a class="logo" href="#top">
      <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><g stroke="#111" stroke-width="2" stroke-linecap="round"><line x1="9" y1="9" x2="23" y2="23"/><line x1="23" y1="9" x2="9" y2="23"/></g><g fill="none" stroke="#111" stroke-width="1.6"><circle cx="6.5" cy="6.5" r="4.2"/><circle cx="25.5" cy="6.5" r="4.2"/><circle cx="6.5" cy="25.5" r="4.2"/><circle cx="25.5" cy="25.5" r="4.2"/></g><rect x="12.5" y="12.5" width="7" height="7" rx="1.5" fill="#111"/></svg>
      Telemetrie
    </a>
    <div class="menu" id="menu">
      <a href="#top" data-go="top" class="on">Übersicht</a>
      <a href="#sec-compare" data-go="compare">Vergleich</a>
      <a href="#sec-battery" data-go="battery">Analysen</a>
      <a href="#sec-fun" data-go="fun">Rekorde</a>
      <a href="#sec-list" data-go="list">Flüge</a>
    </div>
    <div class="tools">
      <input id="q" type="search" placeholder="Flug oder Standort suchen" autocomplete="off">
      <button class="ic" id="btnSearch" title="Suchen" aria-label="Suchen"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><line x1="16" y1="16" x2="21" y2="21"/></svg></button>
      <button class="ic" id="btnProfile" title="Daten und Backup" aria-label="Daten und Backup"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="4"/><path d="M4 21c0-4.4 3.6-7.5 8-7.5s8 3.1 8 7.5"/></svg></button>
      <div class="pop" id="pop">
        <button id="btnSample">Beispieldaten laden</button>
        <hr>
        <button id="btnExport">Backup speichern</button>
        <label for="fileBackup">Backup laden</label>
        <input type="file" id="fileBackup" accept=".json" hidden>
        <hr>
        <button class="del" id="btnClear">Alle Flüge löschen</button>
      </div>
    </div>
  </nav>

  <div class="main">
    <div class="wm" aria-hidden="true">FLIGHT</div>
    <div class="hero">
      <h1>Drohnen-<br>Telemetrie</h1>
      <p class="subline">Flugdaten deiner Drohne als Graphen. Mehrere Flüge direkt vergleichen.</p>
      <div class="actions">
        <label class="btn-o" for="file">Log hochladen</label>
        <input type="file" id="file" accept=".csv,.txt" multiple hidden>
        <a class="link" href="#" id="linkSample">Mit Beispieldaten starten</a>
      </div>
      <div id="msg"></div>
    </div>
    <div class="slider">
      <button class="arrow" id="prev" aria-label="Zurück">&#8592;</button>
      <div class="thumbs" id="thumbs"></div>
      <button class="arrow" id="next" aria-label="Weiter">&#8594;</button>
    </div>
    <div class="statbar" id="statbar"></div>
  </div>

  <div class="side">
    <svg class="drone" viewBox="0 0 520 380" aria-hidden="true">
      <defs>
        <linearGradient id="arm" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a4a4a"/><stop offset="1" stop-color="#151515"/></linearGradient>
        <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a5a5a"/><stop offset=".5" stop-color="#262626"/><stop offset="1" stop-color="#0d0d0d"/></linearGradient>
        <radialGradient id="mot" cx=".35" cy=".3"><stop offset="0" stop-color="#8a8a8a"/><stop offset="1" stop-color="#1a1a1a"/></radialGradient>
        <radialGradient id="disc" cx=".5" cy=".5"><stop offset="0" stop-color="#fff" stop-opacity=".05"/><stop offset=".85" stop-color="#fff" stop-opacity=".25"/><stop offset="1" stop-color="#fff" stop-opacity=".55"/></radialGradient>
      </defs>
      <g transform="translate(260 190)">
        <g stroke-linecap="round">
          <line x1="-150" y1="-100" x2="150" y2="100" stroke="url(#arm)" stroke-width="16"/>
          <line x1="150" y1="-100" x2="-150" y2="100" stroke="url(#arm)" stroke-width="16"/>
          <line x1="-150" y1="-100" x2="150" y2="100" stroke="#fff" stroke-opacity=".12" stroke-width="3" transform="translate(0 -4)"/>

const STORE = "drohnen-dashboard-v2";
const SECTIONS = {
  compare: { title: "Vergleich",       hint: "Kurven der gewählten Flüge übereinander", charts: ["c1"] },
  stats:   { title: "Kennzahlen",      hint: "Tabelle mit besten und schlechtesten Werten", charts: [] },
  trend:   { title: "Verlauf",         hint: "Ein Wert über alle Flüge", charts: ["c2"] },
  battery: { title: "Akku-Gesundheit", hint: "Innenwiderstand und Spannungseinbruch", charts: ["cb1", "cb2"] },
  motor:   { title: "Motorbalance",    hint: "Arbeiten alle vier Motoren gleich viel?", charts: ["cm1"] },
  noise:   { title: "Rauschspektrum",  hint: "Vibrationen nach Frequenz", charts: ["cn1"] },
  fun:     { title: "Rekorde",         hint: "Schnellster, tiefster, stärkster Flug", charts: [] },
  list:    { title: "Flugliste",       hint: "Alle Flüge verwalten, benennen und auswählen", charts: [] }
};

/* ---------- Zustand ---------- */
let flights = load();
let selected = new Set(flights.slice(-3).map(f => f.id));
let metric = "volt";
let trendKey = "minV";
let openSecs = new Set();
const charts = {};

function load() { try { return JSON.parse(localStorage.getItem(STORE)) || []; } catch { return []; } }
function save() { try { localStorage.setItem(STORE, JSON.stringify(flights)); } catch { say("Speicher voll, Daten bleiben nur bis zum Schließen der Seite.", true); } }
function say(t, err) { const m = document.getElementById("msg"); m.textContent = t; m.className = err ? "err" : ""; }
const fmt = (v, d) => (v == null || isNaN(v)) ? "–" : v.toFixed(d);
const avg = a => a.reduce((x, y) => x + y, 0) / (a.length || 1);

/* ---------- Auswertung ---------- */
function fitBattery(s) {
  // V = c0 - R*A + k*mAh (kleinste Quadrate, k ist negativ), R = Innenwiderstand des Packs
  const n = s.v.length; if (n < 30) return null;
  let cum = 0; const X = [];
  for (let i = 0; i < n; i++) { cum += s.a[i] / 3.6; X.push([1, s.a[i], cum]); }
  const A = [[0,0,0],[0,0,0],[0,0,0]], b = [0,0,0];
  for (let i = 3; i < n; i++) for (let p = 0; p < 3; p++) { b[p] += X[i][p] * s.v[i]; for (let q = 0; q < 3; q++) A[p][q] += X[i][p] * X[i][q]; }
  for (let c = 0; c < 3; c++) {
    let m = c; for (let r = c + 1; r < 3; r++) if (Math.abs(A[r][c]) > Math.abs(A[m][c])) m = r;
    if (Math.abs(A[m][c]) < 1e-9) return null;
    [A[c], A[m]] = [A[m], A[c]]; [b[c], b[m]] = [b[m], b[c]];
    for (let r = c + 1; r < 3; r++) { const f = A[r][c] / A[c][c]; for (let q = c; q < 3; q++) A[r][q] -= f * A[c][q]; b[r] -= f * b[c]; }
  }
  const x = [0,0,0];
  for (let r = 2; r >= 0; r--) { let sum = b[r]; for (let q = r + 1; q < 3; q++) sum -= A[r][q] * x[q]; x[r] = sum / A[r][r]; }
  const ir = -x[1] * 1000;
  if (!isFinite(ir) || ir < 0 || ir > 500) return null;
  return { c0: x[0], ir, k: x[2], mm: cum / 2 };
}
function specStats(sp) {
  if (!sp) return {};
  let pi = -1; sp.a.forEach((v, i) => { if (sp.f0 + i * sp.df >= 80 && (pi < 0 || v > sp.a[pi])) pi = i; });
  if (pi < 0) pi = 0;
  const pts = sp.a.map((v, i) => [sp.f0 + i * sp.df, v]).filter(p => p[0] >= 100 && p[0] <= 400);
  return { peakHz: sp.f0 + pi * sp.df, peakDb: sp.a[pi], noiseDb: avg((pts.length ? pts : sp.a.map(v => [0, v])).map(p => p[1])) };
}
function computeStats(s, spec) {
  const n = s.t.length;
  let mah = 0, pow = 0, full = 0;
  for (let i = 0; i < n; i++) { mah += s.a[i] / 3.6; pow = Math.max(pow, s.v[i] * s.a[i]); if (s.t[i] >= 70) full++; }
  const fly = s.h.slice(Math.min(8, n - 1), Math.max(n - 8, 9));
  const fit = fitBattery(s);
  const mAvg = [0,1,2,3].map(k => s["m" + k] && s["m" + k].length ? avg(s["m" + k]) : null);
  return {
    dur: n, minV: Math.min(...s.v), maxA: Math.max(...s.a), mah, avgT: avg(s.t), maxH: Math.max(...s.h), vib: avg(s.g),
    pow, fullT: full, minAlt: fly.length ? Math.max(0, Math.min(...fly)) : null,
    maxSpeed: s.sp && s.sp.length ? Math.max(...s.sp) : null,
    startV: s.v[Math.min(2, n - 1)], ir: fit ? fit.ir : null, fit, mAvg, ...specStats(spec)
  };
}

/* ---------- Beispieldaten ---------- */
function rng(seed) { let x = seed; return () => (x = (x * 1664525 + 1013904223) % 4294967296) / 4294967296; }
function sampleSpectrum(idx, r) {
  const fp = 190 + idx * 4, P = idx === 3 ? 90 : 18 + idx * 2, a = [];
  for (let f = 20; f <= 500; f += 5) {
    const A = 1.5 + 30 * Math.exp(-f / 70) + P * Math.exp(-Math.pow((f - fp) / 12, 2)) + .35 * P * Math.exp(-Math.pow((f - 2 * fp) / 16, 2)) + (r() - .5) * .6;
    a.push(+(20 * Math.log10(A)).toFixed(1));
  }
  return { f0: 20, df: 5, a };
}
function makeSample(idx) {
  const r = rng(101 + idx * 977);
  const dur = 170 + Math.floor(r() * 90);
  const R = 0.02 + idx * 0.006;                       // Akku altert: Innenwiderstand (Ohm) steigt
  const vibBase = idx === 3 ? 21 : 9 + r() * 3;       // Flug 4: leichter Propellerschaden
  const bias = idx === 3 ? [0, .12, -.03, -.02] : [0, 1, 2, 3].map(() => (r() - .5) * .05);
  const speedF = [0.9, 1.0, 1.05, 0.95, 1.5, 1.1][idx];
  const dive = [3.5, 4.0, 0.5, 2.8, 1.6, 2.2][idx];  // tiefster Anflug
  const s = { t: [], m: [], m0: [], m1: [], m2: [], m3: [], v: [], a: [], h: [], g: [], sp: [] };
  let used = 0, alt = 0;
  const ph1 = r() * 6, ph2 = r() * 6;
  for (let i = 0; i < dur; i++) {
    let thr = i < 6 ? 25 + i * 6 : 46 + 9 * Math.sin(i / 9 + ph1) + 6 * Math.sin(i / 3.3 + ph2) + (r() - .5) * 4;
    if (i % 47 > 41) thr += 22;                        // Gasstöße
    if (i > dur - 8) thr = Math.max(20, thr - (i - (dur - 8)) * 4);
    thr = Math.max(0, Math.min(100, thr));
    const amp = 2 + thr * 0.36 + (r() - .5) * 2;
    used += amp / 3.6;
    const ocv = 16.8 - 2.6 * Math.pow(used / 1300, 1.6);
    const volt = ocv - amp * R;
    let target = i < 6 ? i * 4 : 14 + 6 * Math.sin(i / 14 + ph2) + (thr - 46) * .1;
    if (i >= 90 && i < 97) target = dive;
    alt += (target - alt) * .35;
    const mavg = Math.min(100, thr * .96 + 4 + (r() - .5) * 3);
    s.t.push(+thr.toFixed(1));
    s.m.push(+mavg.toFixed(1));
    bias.forEach((b, k) => s["m" + k].push(+Math.min(100, mavg * (1 + b)).toFixed(1)));
    s.a.push(+Math.max(0, amp).toFixed(2));
    s.v.push(+volt.toFixed(3));
    s.h.push(+Math.max(0, alt).toFixed(1));
    s.g.push(+(vibBase + thr * .06 + (r() - .5) * 3).toFixed(1));
    s.sp.push(+Math.max(0, (thr - 30) * 1.7 * speedF + (r() - .5) * 4).toFixed(1));
  }
  return { s, spec: sampleSpectrum(idx, r) };
}
function addSamples() {
  const now = Date.now(), day = 864e5;
  const base = flights.length;
  for (let i = 0; i < 6; i++) {
    const { s, spec } = makeSample(i);
    flights.push({
      id: "s" + now + i, name: "Flug " + (base + i + 1),
      date: new Date(now - (6 - i) * 3 * day).toISOString().slice(0, 10),
      sample: true, series: s, spec, stats: computeStats(s, spec)
    });
  }
  selected = new Set(flights.slice(-3).map(f => f.id));
  save(); render(); say("6 Beispielflüge geladen (erfundene Daten).");
}

/* ---------- FFT ---------- */
function fft(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1; for (; j & bit; bit >>= 1) j ^= bit; j ^= bit;
    if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = -2 * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang), h = len >> 1;
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      for (let j = 0; j < h; j++) {
        const a = i + j, b = a + h;
        const vr = re[b] * cr - im[b] * ci, vi = re[b] * ci + im[b] * cr;
        re[b] = re[a] - vr; im[b] = im[a] - vi; re[a] += vr; im[a] += vi;
        const t = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = t;
      }
    }
  }
}
function computeSpectrum(axes, fs) {
  const N = 1024, len = axes[0].length;
  if (!axes.length || len < N * 2 || !isFinite(fs) || fs < 200) return null;
  const win = Float64Array.from({ length: N }, (_, i) => .5 - .5 * Math.cos(2 * Math.PI * i / (N - 1)));
  const pw = new Float64Array(N / 2);
  const hop = Math.max(N / 2, Math.floor((len - N) / 300)); // höchstens ~300 Fenster pro Achse
  let cnt = 0;
  const re = new Float64Array(N), im = new Float64Array(N);
  for (const ax of axes) for (let p = 0; p + N <= len; p += hop) {
    let mean = 0; for (let i = 0; i < N; i++) mean += ax[p + i]; mean /= N;
    for (let i = 0; i < N; i++) { re[i] = (ax[p + i] - mean) * win[i]; im[i] = 0; }
    fft(re, im);
    for (let k = 0; k < N / 2; k++) pw[k] += re[k] * re[k] + im[k] * im[k];
    cnt++;
  }
  const fmax = Math.min(500, fs / 2), k0 = Math.ceil(20 * N / fs), k1 = Math.floor(fmax * N / fs);
  const grp = Math.max(1, Math.floor((k1 - k0 + 1) / 100)), a = [];
  for (let k = k0; k + grp - 1 <= k1; k += grp) {
    let sum = 0; for (let j = 0; j < grp; j++) sum += pw[k + j];
    const amp = Math.sqrt(sum / grp / cnt) / (N / 4);
    a.push(+(20 * Math.log10(amp + 1e-9)).toFixed(1));
  }
  return { f0: k0 * fs / N, df: grp * fs / N, a };
}

/* ---------- CSV-Import (Betaflight Blackbox Explorer / blackbox_decode) ---------- */
function parseCSV(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  let hi = lines.findIndex(l => /time/i.test(l) && l.includes(","));
  if (hi < 0) throw new Error("Keine Kopfzeile mit 'time' gefunden.");
  const head = lines[hi].split(",").map(h => h.replace(/"/g, "").trim().toLowerCase());
  const col = re => head.findIndex(h => re.test(h));
  const cT = col(/^time/), cV = col(/vbat/), cA = col(/amperage/), cThr = col(/rccommand\[3\]/),
        cH = col(/baroalt|gps_altitude|altitude/), cS = col(/gps_speed/),
        cM = [0, 1, 2, 3].map(i => head.indexOf("motor[" + i + "]")),
        cG = [0, 1, 2].map(i => head.findIndex(h => h.startsWith("gyroadc[" + i + "]"))).filter(i => i >= 0);
  if (cT < 0) throw new Error("Spalte 'time' fehlt.");
  const bins = new Map();
  let t0 = null, mMax = 0;
  const rows = [];
  for (let i = hi + 1; i < lines.length; i++) {
    const c = lines[i].split(",");
    const t = parseFloat(c[cT]); if (isNaN(t)) continue;
    if (t0 == null) t0 = t;
    rows.push(c);
    for (const k of cM) if (k >= 0) mMax = Math.max(mMax, parseFloat(c[k]) || 0);
  }
  if (rows.length < 20) throw new Error("Zu wenige Datenzeilen.");
  const tScale = 1e-6; // Blackbox: Mikrosekunden
  const mPct = x => mMax > 1200 ? x / 2047 * 100 : (x - 1000) / 10;
  for (const c of rows) {
    const sec = Math.floor((parseFloat(c[cT]) - t0) * tScale);
    if (!bins.has(sec)) bins.set(sec, { n: 0, v: 0, a: 0, t: 0, m: 0, m0: 0, m1: 0, m2: 0, m3: 0, h: 0, g: 0, sp: 0 });
    const b = bins.get(sec); b.n++;
    let v = cV >= 0 ? parseFloat(c[cV]) : NaN; if (v > 100) v /= 100;
    let a = cA >= 0 ? parseFloat(c[cA]) : NaN; if (a > 300) a /= 100;
    b.v += isNaN(v) ? 0 : v; b.a += isNaN(a) ? 0 : a;
    b.t += cThr >= 0 ? Math.max(0, Math.min(100, (parseFloat(c[cThr]) - 1000) / 10)) : 0;
    let msum = 0, mc = 0;
    cM.forEach((k, i) => { if (k >= 0) { const p = mPct(parseFloat(c[k]) || 0); b["m" + i] += p; msum += p; mc++; } });
    b.m += mc ? msum / mc : 0;
    let h = cH >= 0 ? parseFloat(c[cH]) : 0; if (cH >= 0 && /baroalt/.test(head[cH])) h /= 100;
    b.h += isNaN(h) ? 0 : h;
    b.g += cG.length ? Math.sqrt(cG.reduce((x, k) => x + Math.pow(parseFloat(c[k]) || 0, 2), 0)) : 0;
    b.sp += cS >= 0 ? (parseFloat(c[cS]) || 0) * 3.6 : 0; // m/s -> km/h
  }
  const secs = [...bins.keys()].sort((x, y) => x - y);
  const s = { t: [], m: [], m0: [], m1: [], m2: [], m3: [], v: [], a: [], h: [], g: [], sp: [] };
  const push = (key, val, d) => s[key].push(+val.toFixed(d));
  for (const k of secs) {
    const b = bins.get(k), n = b.n;
    push("v", b.v / n, 3); push("a", b.a / n, 2); push("t", b.t / n, 1); push("m", b.m / n, 1);
    for (let i = 0; i < 4; i++) push("m" + i, b["m" + i] / n, 1);
    push("h", b.h / n, 1); push("g", b.g / n, 1);
    if (cS >= 0) push("sp", b.sp / n, 1);
  }
  // Rauschspektrum aus den hochaufgelösten Gyro-Daten
  let spec = null;
  if (cG.length) {
    const dts = []; let prev = null;
    for (let i = 0; i < Math.min(rows.length, 600); i++) { const t = parseFloat(rows[i][cT]); if (prev != null && t > prev) dts.push(t - prev); prev = t; }
    dts.sort((x, y) => x - y);
    const fs = 1 / ((dts[Math.floor(dts.length / 2)] || 0) * tScale);
    const axes = cG.map(k => Float64Array.from(rows, c => parseFloat(c[k]) || 0));
    spec = computeSpectrum(axes, fs);
  }
  return { series: s, spec, missing: { spannung: cV < 0, strom: cA < 0, gas: cThr < 0, motoren: cM.some(k => k < 0), hoehe: cH < 0, gps_speed: cS < 0, gyro: !cG.length } };
}
async function importFiles(list) {
  let ok = 0, warn = [];
  for (const f of list) {
    try {
      const { series, spec, missing } = parseCSV(await f.text());
      const nm = f.name.replace(/\.[^.]+$/, "");
      flights.push({ id: "f" + Date.now() + Math.random().toString(36).slice(2, 6), name: nm.slice(0, 24),
        date: new Date(f.lastModified).toISOString().slice(0, 10), series, spec, stats: computeStats(series, spec) });
      selected.add(flights[flights.length - 1].id);
      const miss = Object.entries(missing).filter(e => e[1]).map(e => e[0]);
      if (miss.length) warn.push(f.name + ": keine Daten für " + miss.join(", "));
      ok++;
    } catch (e) { say(f.name + ": " + e.message, true); return render(); }
  }
  save(); render();
  say(ok + " Flug/Flüge importiert." + (warn.length ? " Hinweis: " + warn.join("; ") : ""));
}

/* ---------- Darstellung ---------- */
const app = document.getElementById("app");
const colorOf = f => COLORS[flights.indexOf(f) % COLORS.length];
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const cls = (v, best, worst) => v === best ? "best" : v === worst ? "worst" : "";

function tile(k, v, unit, d, dcls, pct) {
  return `<div class="tile"><div class="k">${k}</div><div class="v">${v}<small>${unit}</small></div>
    <div class="d ${dcls || ""}">${d || "&nbsp;"}</div>${pct != null ? `<div class="gauge"><b style="width:${Math.max(4, Math.min(100, pct))}%"></b></div>` : ""}</div>`;
}
function tilesHTML(sel) {
  const cur = sel[sel.length - 1];
  const prev = flights[flights.indexOf(cur) - 1];
  return `<div class="who">Letzter gewählter Flug: <b>${esc(cur.name)}</b>${cur.loc ? ` @ ${esc(cur.loc)}` : ""}${prev ? ` · Änderung zu <b>${esc(prev.name)}</b>` : ""}</div>
    <div class="tiles">${TILE_KEYS.map(k => {
      const s = STATS[k], v = s.get(cur), max = Math.max(...flights.map(s.get)) || 1;
      let d = "", c = "";
      if (prev) {
        const dv = v - s.get(prev), good = s.better === "high" ? dv > 0 : dv < 0;
        c = Math.abs(dv) < 1e-9 ? "" : (good ? "good" : "bad");
        d = (dv > 0 ? "▲ +" : dv < 0 ? "▼ " : "= ") + fmt(dv, s.dec) + " " + s.unit;
      }
      return tile(s.label, fmt(v, s.dec), s.unit, d, c, v / max * 100);
    }).join("")}</div>`;
}

/* --- Bereiche --- */
function needSel(sel) { return sel.length ? "" : `<p class="note">Wähle oben mindestens einen Flug aus.</p>`; }

function batteryHTML(sel) {
  if (!sel.length) return needSel(sel);
  const cur = sel[sel.length - 1], first = flights[0], st = cur.stats;
  let d = "Basis-Flug", c = "", verdict = "";
  if (st.ir != null && first.stats.ir != null && cur !== first) {
    const pct = (st.ir / first.stats.ir - 1) * 100;
    d = (pct >= 0 ? "▲ +" : "▼ ") + fmt(pct, 0) + " % ggü. " + esc(first.name);
    c = pct > 5 ? "bad" : pct < -5 ? "good" : "";
    verdict = pct < 15 ? `<div class="verdict good"><b>Akku unauffällig.</b> Der Innenwiderstand liegt nahe am ersten Flug.</div>`
      : pct < 40 ? `<div class="verdict warn"><b>Akku lässt nach.</b> Der Innenwiderstand ist um ${fmt(pct, 0)} % gestiegen. Beobachte den Verlauf.</div>`
      : `<div class="verdict bad"><b>Akku deutlich schwächer.</b> Der Innenwiderstand ist um ${fmt(pct, 0)} % gestiegen. Prüfe den Akku, bevor du weiterfliegst.</div>`;
  }
  const rows = sel.map(f => f.stats.ir);
  const okIr = rows.filter(v => v != null);
  const bIr = Math.min(...okIr), wIr = Math.max(...okIr);
  return `<div class="who">Letzter gewählter Flug: <b>${esc(cur.name)}</b></div>
    <div class="tiles">
      ${tile("Innenwiderstand", fmt(st.ir, 0), "mΩ", d, c)}
      ${tile("Spannungseinbruch", fmt(st.startV - st.minV, 2), "V", "Start " + fmt(st.startV, 2) + " V, Minimum " + fmt(st.minV, 2) + " V")}
      ${tile("Verbrauch", fmt(st.mah, 0), "mAh", "Max. Strom " + fmt(st.maxA, 1) + " A")}
    </div>${verdict}
    <div class="sublabel">Spannung gegen Strom (jeder Punkt = 1 Sekunde, Linie = Trend)</div>
    <div class="chartbox"><canvas id="cb1"></canvas></div>
    <div class="sublabel">Innenwiderstand über alle Flüge</div>
    <div class="chartbox" style="height:240px"><canvas id="cb2"></canvas></div>
    <div class="scrollx" style="margin-top:20px"><table><thead><tr><th>Flug</th><th>Innenwiderstand</th><th>Spannungseinbruch</th><th>Verbrauch</th></tr></thead><tbody>
      ${sel.map(f => `<tr><td>${sw(f)}${esc(f.name)}</td>
        <td class="${sel.length > 1 && f.stats.ir != null ? cls(f.stats.ir, bIr, wIr) : ""}">${fmt(f.stats.ir, 0)} mΩ</td>
        <td>${fmt(f.stats.startV - f.stats.minV, 2)} V</td><td>${fmt(f.stats.mah, 0)} mAh</td></tr>`).join("")}
    </tbody></table></div>
    <p class="note">Der Innenwiderstand wird geschätzt: Aus Spannung, Strom und verbrauchter Ladung wird berechnet, wie stark die Spannung pro Ampere einbricht. Ein steigender Wert über mehrere Flüge zeigt einen alternden Akku. Die Zahl ist eine Schätzung und kein Messwert eines Ladegeräts.</p>`;
}
function motorDev(f) {
  const m = f.stats.mAvg; if (m.some(v => v == null)) return null;
  const mean = avg(m);
  return m.map(v => (v - mean) / mean * 100);
}
function motorHTML(sel) {
  if (!sel.length) return needSel(sel);
  const devs = sel.map(motorDev), spread = devs.map(d => d ? Math.max(...d) - Math.min(...d) : null);
  return `<div class="sublabel" style="margin-top:0">Abweichung jedes Motors vom Durchschnitt aller vier</div>
    <div class="chartbox" style="height:300px"><canvas id="cm1"></canvas></div>
    <div class="scrollx" style="margin-top:20px"><table><thead><tr><th>Flug</th><th>M1</th><th>M2</th><th>M3</th><th>M4</th><th>Unterschied</th><th>Bewertung</th></tr></thead><tbody>
      ${sel.map((f, i) => `<tr><td>${sw(f)}${esc(f.name)}</td>
        ${f.stats.mAvg.map(v => `<td>${fmt(v, 1)} %</td>`).join("")}
        <td>${fmt(spread[i], 1)} %</td>
        <td class="${spread[i] == null ? "" : spread[i] > 20 ? "worst" : spread[i] > 10 ? "" : "best"}">${spread[i] == null ? "keine Daten" : spread[i] > 20 ? "auffällig" : spread[i] > 10 ? "leicht ungleich" : "ausgeglichen"}</td></tr>`).join("")}
    </tbody></table></div>
    <p class="note">M1 bis M4 sind die vier Motorausgänge in Betaflight. Die Balken zeigen, ob ein Motor im Schnitt mehr Leistung ausgeben muss als die anderen. Ein dauerhaft höherer Wert kann auf einen verbogenen Propeller, ein müdes Lager oder einen verschobenen Schwerpunkt hindeuten. Die Grenzen (10 % und 20 %) sind grobe Richtwerte.</p>`;
}
function noiseHTML(sel) {
  if (!sel.length) return needSel(sel);
  const ok = sel.filter(f => f.spec);
  const pk = ok.map(f => f.stats.noiseDb), b = Math.min(...pk), w = Math.max(...pk);
  return `<div class="chartbox"><canvas id="cn1"></canvas></div>
    ${ok.length < sel.length ? `<p class="note">Für ${sel.length - ok.length} Flug/Flüge fehlen Gyro-Daten mit genug Auflösung, sie erscheinen nicht im Graphen.</p>` : ""}
    <div class="scrollx" style="margin-top:20px"><table><thead><tr><th>Flug</th><th>Stärkster Peak</th><th>Peak-Stärke</th><th>Grundrauschen</th></tr></thead><tbody>
      ${sel.map(f => `<tr><td>${sw(f)}${esc(f.name)}</td>
        <td>${f.spec ? fmt(f.stats.peakHz, 0) + " Hz" : "–"}</td><td>${f.spec ? fmt(f.stats.peakDb, 1) + " dB" : "–"}</td>
        <td class="${f.spec && ok.length > 1 ? cls(f.stats.noiseDb, b, w) : ""}">${f.spec ? fmt(f.stats.noiseDb, 1) + " dB" : "–"}</td></tr>`).join("")}
    </tbody></table></div>
    <p class="note">Der Graph zeigt, bei welcher Frequenz die Drohne wie stark vibriert. Ein hoher Peak entsteht oft durch Propeller oder Motoren, etwa nach einem Aufprall. Das Grundrauschen (Mittel von 100 bis 400 Hz) zeigt, wie sauber die Drohne insgesamt läuft. Tiefere Werte sind besser. Die dB-Skala hängt vom Logging ab, vergleiche also nur Flüge, die gleich eingestellt geloggt wurden.</p>`;
}
function funHTML() {
  const selIds = selected;
  return `<div class="recs">${RECORDS.map(r => {
    const list = flights.map(f => ({ f, v: r.get(f) })).filter(x => x.v != null && !isNaN(x.v));
    if (!list.length) return `<div class="rec"><h4>${r.label}</h4><div class="sub2">${r.sub}</div><p class="note">Keine Daten vorhanden.</p></div>`;
    const bestV = r.best === "high" ? Math.max(...list.map(x => x.v)) : Math.min(...list.map(x => x.v));
    const win = list.find(x => x.v === bestV), max = Math.max(...list.map(x => x.v)) || 1;
    const rank = list.slice().sort((a, b) => r.best === "high" ? b.v - a.v : a.v - b.v);
    return `<div class="rec"><h4>${r.label}</h4><div class="sub2">${r.sub}</div>
      <div class="top"><span class="big">${fmt(bestV, r.dec)}<small> ${r.unit}</small></span><span class="badge">REKORD</span><span style="color:${colorOf(win.f)};font-weight:700">${esc(win.f.name)}</span></div>
      ${rank.map(x => `<div class="rank ${x.v === bestV ? "win" : ""}"><span class="nm ${selIds.has(x.f.id) ? "sel" : ""}" style="${selIds.has(x.f.id) ? "color:" + colorOf(x.f) : ""}">${esc(x.f.name)}</span>
        <span class="track"><b style="width:${Math.max(3, x.v / max * 100)}%;background:${colorOf(x.f)}"></b></span><span class="val">${fmt(x.v, r.dec)} ${r.unit}</span></div>`).join("")}
    </div>`;
  }).join("")}</div>
  <p class="note">Alle Flüge im Vergleich. Die Namen der oben ausgewählten Flüge sind farbig hervorgehoben. Bei Tiefflug gewinnt der niedrigste Wert. Die Geschwindigkeit erscheint nur, wenn die CSV GPS-Daten enthält.</p>`;
}


/* ---------- Graustufen-Stil pro Flug ---------- */
const dashed = f => flights.indexOf(f) % 8 >= 4;
const sw = f => `<i class="sw ${dashed(f) ? "dash" : ""}" style="--c:${colorOf(f)}"></i>`;
const getSel = () => flights.filter(f => selected.has(f.id));
let query = "";
const visible = () => { const q = query.trim().toLowerCase(); return q ? flights.filter(f => (f.name + " " + (f.loc || "")).toLowerCase().includes(q)) : flights; };

/* ---------- Bühne: Slider und Stat-Leiste ---------- */
function spark(f) {
  const v = f.series.v, n = v.length; if (n < 2) return "";
  const mn = Math.min(...v), mx = Math.max(...v), step = Math.max(1, Math.floor(n / 40));
  const pts = v.filter((_, i) => i % step === 0).map((y, i, a) => `${(1 + i / (a.length - 1) * 38).toFixed(1)},${(37 - (y - mn) / ((mx - mn) || 1) * 33).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 40 40"><polyline points="${pts}" fill="none" stroke="${colorOf(f)}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" ${dashed(f) ? 'stroke-dasharray="4 3"' : ""}/></svg>`;
}
function renderStage() {
  const vis = visible();
  document.getElementById("thumbs").innerHTML = vis.length ? vis.map(f => `
    <button class="th ${selected.has(f.id) ? "on" : ""}" data-id="${f.id}" title="${esc(f.name)}${f.loc ? " @ " + esc(f.loc) : ""} · ${f.date}">
      <span class="c">${spark(f)}</span><span class="n">${esc(f.name)}</span></button>`).join("")
    : `<div class="none">${flights.length ? "Kein Flug gefunden." : "Noch keine Flüge. Lade ein Log hoch oder starte mit Beispieldaten."}</div>`;
  const sel = getSel(), cur = sel[sel.length - 1], prev = cur && flights[flights.indexOf(cur) - 1];
  const items = [["dur", "Flugzeit"], ["minV", "Min. Spannung"], ["maxA", "Max. Strom"], ["mah", "Verbrauch"]].map(([k, label]) => ({ s: STATS[k], label }))
    .concat([{ s: { unit: "km/h", dec: 0, better: "high", get: f => f.stats.maxSpeed }, label: "Höchstgeschw." }]);
  document.getElementById("statbar").innerHTML = items.map(({ s, label }) => {
    const v = cur ? s.get(cur) : null;
    let d = "";
    if (cur && prev && v != null && s.get(prev) != null) { const dv = v - s.get(prev); d = Math.abs(dv) < 1e-9 ? "wie " + esc(prev.name) : (dv > 0 ? "↑ +" : "↓ ") + fmt(dv, s.dec) + " ggü. " + esc(prev.name); }
    return `<div class="st"><div class="v">${fmt(v, s.dec)}${v != null ? `<small>${s.unit}</small>` : ""}</div><div class="k">${label}</div><div class="d">${d || (cur ? (cur.loc ? "@ " + esc(cur.loc) : esc(cur.name)) : "")}</div></div>`;
  }).join("");
}

/* ---------- Karten ---------- */
const ORDER = ["compare", "stats", "trend", "battery", "motor", "noise", "fun", "list"];
function compareHTML(sel) {
  return `<div class="tabs">${Object.entries(METRICS).map(([k, m]) => `<button class="tab ${k === metric ? "on" : ""}" data-m="${k}">${m.label}</button>`).join("")}</div>
    <div class="chartbox"><canvas id="c1"></canvas></div>${needSel(sel)}`;
}
function statsHTML(sel) {
  if (!sel.length) return needSel(sel);
  return `<div class="scrollx"><table>
      <thead><tr><th>Flug</th>${Object.values(STATS).map(s => `<th>${s.label}</th>`).join("")}</tr></thead>
      <tbody>${sel.map(f => `<tr><td>${sw(f)}${esc(f.name)}</td>${Object.values(STATS).map(s => {
        const vals = sel.map(s.get), v = s.get(f);
        let c = "";
        if (sel.length > 1 && s.better) c = cls(v, s.better === "high" ? Math.max(...vals) : Math.min(...vals), s.better === "high" ? Math.min(...vals) : Math.max(...vals));
        return `<td class="${c}">${fmt(v, s.dec)} ${s.unit}</td>`;
      }).join("")}</tr>`).join("")}</tbody>
    </table></div>
    <p class="note">Fett = bester Wert, gepunktet unterstrichen = schlechtester Wert im Vergleich. Der Verbrauch wird aus dem Strom berechnet.</p>`;
}
function trendHTML() {
  return `<div class="row"><span class="note" style="margin:0">Zeigt, wie sich ein Wert von Flug zu Flug entwickelt, zum Beispiel ob dein Akku schwächer wird.</span>
      <select id="trendSel">${Object.entries(STATS).map(([k, s]) => `<option value="${k}" ${k === trendKey ? "selected" : ""}>${s.label}</option>`).join("")}</select></div>
    <div class="chartbox" style="height:260px"><canvas id="c2"></canvas></div>`;
}
function listHTML() {
  const vis = visible();
  if (!vis.length) return `<div class="empty">${flights.length ? "Kein Flug gefunden." : "Noch keine Flüge."}</div>`;
  return `<div class="scrollx"><table><thead><tr><th></th><th>Flug</th><th>Standort</th><th>Datum</th><th>Flugzeit</th><th>Verbrauch</th><th></th></tr></thead><tbody>
    ${vis.map(f => `<tr><td style="width:36px"><input class="chk" type="checkbox" data-sel="${f.id}" ${selected.has(f.id) ? "checked" : ""} aria-label="Flug auswählen"></td>
      <td>${sw(f)}${esc(f.name)}</td><td>${f.loc ? esc(f.loc) : "–"}</td><td>${f.date || "–"}</td><td>${fmt(f.stats.dur, 0)} s</td><td>${fmt(f.stats.mah, 0)} mAh</td>
      <td class="rowact"><button data-edit="${f.id}">Bearbeiten</button><button data-del="${f.id}">Löschen</button></td></tr>`).join("")}
  </tbody></table></div>
  <p class="note">Mit dem Häkchen wählst du Flüge für alle Vergleiche aus. Die Suche oben rechts filtert diese Liste.</p>`;
}
const SECTION_HTML = { compare: compareHTML, stats: statsHTML, trend: trendHTML, battery: batteryHTML, motor: motorHTML, noise: noiseHTML, fun: funHTML, list: listHTML };

function render() {
  Object.keys(charts).forEach(k => { charts[k].destroy(); delete charts[k]; });
  renderStage();
  const sel = getSel();
  document.getElementById("cards").innerHTML = flights.length ? ORDER.map(id => `
    <details class="card" id="sec-${id}" data-sec="${id}" ${openSecs.has(id) ? "open" : ""}>
      <summary><span class="ttl">${SECTIONS[id].title}</span><span class="hint">${SECTIONS[id].hint}</span></summary>
      <div class="fold-body">${SECTION_HTML[id](sel)}</div>
    </details>`).join("") : "";
  openSecs.forEach(id => drawSection(id, sel));
}

/* ---------- Diagramme (Graustufen) ---------- */
function mk(id, cfg) { if (charts[id]) charts[id].destroy(); const el = document.getElementById(id); if (!el) return; charts[id] = new Chart(el, cfg); }
function chartBase() {
  Chart.defaults.color = "#8c8c8c";
  Chart.defaults.font.family = '"Outfit", system-ui, sans-serif';
  Chart.defaults.font.size = 12.5;
  return {
    maintainAspectRatio: false, animation: { duration: 400 },
    interaction: { mode: "index", intersect: false },
    plugins: {
      legend: { labels: { usePointStyle: true, pointStyle: "line", boxWidth: 24, font: { weight: "500" } } },
      tooltip: { backgroundColor: "#111", titleColor: "#fff", bodyColor: "#e5e5e5", padding: 12, cornerRadius: 8, boxPadding: 4 }
    },
    scales: { x: { grid: { color: "rgba(0,0,0,.06)" }, border: { display: false }, ticks: { maxTicksLimit: 10 } }, y: { grid: { color: "rgba(0,0,0,.06)" }, border: { display: false } } }
  };
}
const axisTitle = t => ({ display: true, text: t });
const lineStyle = f => ({ borderColor: colorOf(f), backgroundColor: colorOf(f), borderDash: dashed(f) ? [6, 4] : [] });
const trendLine = (data, label) => ({ label, data, borderColor: "#111", backgroundColor: "rgba(0,0,0,.05)", fill: true, borderWidth: 2.5, tension: .2, pointRadius: 5, pointBackgroundColor: "#fff", pointBorderColor: "#111", pointBorderWidth: 2 });

function drawCompare(sel) {
  const m = METRICS[metric];
  const maxLen = Math.max(0, ...sel.map(f => f.series.t.length));
  const opts = chartBase();
  opts.scales.x.title = axisTitle("Zeit (s)");
  opts.scales.y.title = axisTitle(m.unit ? m.label + " (" + m.unit + ")" : m.label);
  opts.plugins.tooltip.callbacks = { title: i => "t = " + i[0].label + " s", label: c => `${c.dataset.label}: ${fmt(c.parsed.y, m.dec)} ${m.unit}` };
  mk("c1", { type: "line", options: opts,
    data: { labels: Array.from({ length: maxLen }, (_, i) => i), datasets: sel.map(f => ({ label: f.name, data: f.series[m.key], ...lineStyle(f), borderWidth: 2, pointRadius: 0, pointHoverRadius: 4, tension: .2 })) } });
}
function drawTrend() {
  const s = STATS[trendKey];
  const opts = chartBase();
  opts.plugins.legend.display = false;
  opts.scales.y.title = axisTitle(s.label + (s.unit ? " (" + s.unit + ")" : ""));
  opts.plugins.tooltip.callbacks = { label: c => `${fmt(c.parsed.y, s.dec)} ${s.unit}` };
  mk("c2", { type: "line", options: opts, data: { labels: flights.map(f => f.name), datasets: [trendLine(flights.map(s.get), s.label)] } });
}
function drawSection(id, sel) {
  sel = sel || getSel();
  if (id === "trend") return drawTrend();
  if (!sel.length) return;
  if (id === "compare") return drawCompare(sel);
  if (id === "battery") {
    const opts = chartBase();
    opts.interaction = { mode: "nearest", intersect: true };
    opts.scales.x = { type: "linear", grid: opts.scales.x.grid, border: { display: false }, title: axisTitle("Strom (A)") };
    opts.scales.y.title = axisTitle("Spannung (V)");
    opts.plugins.legend.labels.filter = i => !i.text.endsWith(" Trend");
    opts.plugins.tooltip.callbacks = { label: c => `${c.dataset.label}: ${fmt(c.parsed.y, 2)} V bei ${fmt(c.parsed.x, 1)} A` };
    const ds = [];
    sel.forEach(f => {
      const col = colorOf(f);
      ds.push({ label: f.name, type: "scatter", data: f.series.a.map((a, i) => ({ x: a, y: f.series.v[i] })).slice(3), backgroundColor: col + "88", borderColor: col + "88", pointRadius: 3 });
      const ft = f.stats.fit;
      if (ft) { const mx = Math.max(...f.series.a); ds.push({ label: f.name + " Trend", type: "scatter", showLine: true, borderColor: col, borderWidth: 2.5, borderDash: dashed(f) ? [6, 4] : [], pointRadius: 0,
        data: [0, mx].map(a => ({ x: a, y: ft.c0 - ft.ir / 1000 * a + ft.k * ft.mm })) }); }
    });
    mk("cb1", { type: "scatter", data: { datasets: ds }, options: opts });
    const o2 = chartBase();
    o2.plugins.legend.display = false;
    o2.scales.y.title = axisTitle("Innenwiderstand (mΩ)");
    o2.plugins.tooltip.callbacks = { label: c => `${fmt(c.parsed.y, 0)} mΩ` };
    mk("cb2", { type: "line", options: o2, data: { labels: flights.map(f => f.name), datasets: [trendLine(flights.map(f => f.stats.ir), "Innenwiderstand")] } });
  } else if (id === "motor") {
    const opts = chartBase();
    opts.scales.y.title = axisTitle("Abweichung vom Durchschnitt (%)");
    opts.plugins.legend.labels.pointStyle = "rect"; opts.plugins.legend.labels.boxWidth = 12;
    opts.plugins.tooltip.callbacks = { label: c => `${c.dataset.label}: ${c.parsed.y >= 0 ? "+" : ""}${fmt(c.parsed.y, 1)} %` };
    mk("cm1", { type: "bar", options: opts,
      data: { labels: ["M1", "M2", "M3", "M4"], datasets: sel.filter(f => motorDev(f)).map(f => ({ label: f.name, data: motorDev(f),
        backgroundColor: dashed(f) ? "#fff" : colorOf(f), borderColor: colorOf(f), borderWidth: 2, borderRadius: 4 })) } });
  } else if (id === "noise") {
    const opts = chartBase();
    opts.scales.x = { type: "linear", min: 20, max: 500, grid: opts.scales.x.grid, border: { display: false }, title: axisTitle("Frequenz (Hz)") };
    opts.scales.y.title = axisTitle("Stärke (dB)");
    opts.plugins.tooltip.callbacks = { title: i => fmt(i[0].parsed.x, 0) + " Hz", label: c => `${c.dataset.label}: ${fmt(c.parsed.y, 1)} dB` };
    mk("cn1", { type: "line", options: opts,
      data: { datasets: sel.filter(f => f.spec).map(f => ({ label: f.name, ...lineStyle(f), borderWidth: 2, pointRadius: 0, tension: .2,
        data: f.spec.a.map((v, i) => ({ x: f.spec.f0 + i * f.spec.df, y: v })) })) } });
  }
}

/* ---------- Ereignisse ---------- */
const cardsEl = document.getElementById("cards");
const toggleSel = id => { selected.has(id) ? selected.delete(id) : selected.add(id); render(); };
document.getElementById("thumbs").addEventListener("click", e => { const t = e.target.closest(".th"); if (t) toggleSel(t.dataset.id); });
document.getElementById("prev").onclick = () => document.getElementById("thumbs").scrollBy({ left: -220, behavior: "smooth" });
document.getElementById("next").onclick = () => document.getElementById("thumbs").scrollBy({ left: 220, behavior: "smooth" });

cardsEl.addEventListener("click", e => {
  const del = e.target.closest("[data-del]");
  if (del) {
    const f = flights.find(x => x.id === del.dataset.del);
    if (!f || !confirm("Flug „" + f.name + "“ löschen?")) return;
    flights = flights.filter(x => x.id !== f.id); selected.delete(f.id); save(); render(); return;
  }
  const ed = e.target.closest("[data-edit]");
  if (ed) { editFlight(ed.dataset.edit); return; }
  const tab = e.target.closest("[data-m]");
  if (tab) { metric = tab.dataset.m; render(); }
});
cardsEl.addEventListener("change", e => {
  if (e.target.id === "trendSel") { trendKey = e.target.value; render(); return; }
  if (e.target.dataset && e.target.dataset.sel) toggleSel(e.target.dataset.sel);
});
// Bereiche auf- und zuklappen: Diagramme erst zeichnen, wenn der Bereich sichtbar ist
cardsEl.addEventListener("toggle", e => {
  const id = e.target.dataset && e.target.dataset.sec; if (!id) return;
  if (e.target.open) {
    openSecs.add(id);
    if (!SECTIONS[id].charts.every(c => charts[c])) drawSection(id);
  } else {
    openSecs.delete(id);
    SECTIONS[id].charts.forEach(c => { if (charts[c]) { charts[c].destroy(); delete charts[c]; } });
  }
}, true);

// Navigation und Sprungziele
function goTo(id) {
  if (id === "top") return window.scrollTo({ top: 0, behavior: "smooth" });
  const d = document.getElementById("sec-" + id);
  if (!d) return say("Lade zuerst Flüge, dann erscheinen die Auswertungen.");
  if (!d.open) d.open = true;
  d.scrollIntoView({ behavior: "smooth", block: "start" });
}
document.addEventListener("click", e => { const a = e.target.closest("[data-go]"); if (a) { e.preventDefault(); goTo(a.dataset.go); } });
const spyIds = [["top", "top"], ["compare", "sec-compare"], ["battery", "sec-battery"], ["fun", "sec-fun"], ["list", "sec-list"]];
function spy() {
  let cur = "top";
  spyIds.forEach(([k, id]) => { const el = document.getElementById(id); if (el && el.getBoundingClientRect().top < innerHeight * 0.45 && k !== "top") cur = k; });
  document.querySelectorAll("#menu a").forEach(a => a.classList.toggle("on", a.dataset.go === cur));
}
addEventListener("scroll", spy, { passive: true });

// Suche und Menü
const q = document.getElementById("q"), pop = document.getElementById("pop");
document.getElementById("btnSearch").onclick = e => { const on = q.classList.toggle("open"); e.currentTarget.classList.toggle("on", on); if (on) q.focus(); else { q.value = ""; query = ""; renderStage(); refreshList(); } };
function refreshList() { const b = document.querySelector("#sec-list .fold-body"); if (b) b.innerHTML = listHTML(); }
q.addEventListener("input", () => { query = q.value; renderStage(); refreshList(); });
document.getElementById("btnProfile").onclick = e => { e.stopPropagation(); pop.classList.toggle("open"); };
document.addEventListener("click", e => { if (!e.target.closest("#pop") && !e.target.closest("#btnProfile")) pop.classList.remove("open"); });
document.addEventListener("keydown", e => { if (e.key === "Escape") pop.classList.remove("open"); });
pop.addEventListener("click", e => { if (e.target.closest("button")) pop.classList.remove("open"); });

// Flug umbenennen / Standort und Datum ändern
const dlg = document.getElementById("dlg");
let editId = null;
function editFlight(id) {
  const f = flights.find(x => x.id === id); if (!f) return;
  editId = id;
  document.getElementById("dName").value = f.name;
  document.getElementById("dLoc").value = f.loc || "";
  document.getElementById("dDate").value = f.date || "";
  dlg.returnValue = "";
  dlg.showModal();
}
dlg.addEventListener("close", () => {
  const f = flights.find(x => x.id === editId);
  if (dlg.returnValue === "ok" && f) {
    f.name = document.getElementById("dName").value.trim().slice(0, 30) || f.name;
    f.loc = document.getElementById("dLoc").value.trim().slice(0, 40);
    f.date = document.getElementById("dDate").value || f.date;
    save(); render();
  }
  editId = null;
});

// Backup: alle Flüge als Datei speichern und wieder laden (z. B. für ein anderes Gerät)
document.getElementById("btnExport").onclick = () => {
  if (!flights.length) return say("Es gibt noch keine Flüge zum Speichern.", true);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ app: "drohnen-dashboard", version: 2, flights })], { type: "application/json" }));
  a.download = "drohnen-fluege-" + new Date().toISOString().slice(0, 10) + ".json";
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  say(flights.length + " Flüge als Backup gespeichert.");
};
document.getElementById("fileBackup").onchange = async e => {
  const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    const list = (data && data.flights || []).filter(f => f && f.id && f.series && f.stats && Array.isArray(f.series.t));
    if (!list.length) throw new Error("Keine gültigen Flüge in der Datei.");
    const have = new Set(flights.map(f => f.id));
    const add = list.filter(f => !have.has(f.id)).map(f => ({ ...f, name: String(f.name || "Flug").slice(0, 30), loc: String(f.loc || "").slice(0, 40), date: String(f.date || "").slice(0, 10) }));
    flights.push(...add); add.forEach(f => selected.add(f.id));
    save(); render(); say(add.length + " Flüge geladen, " + (list.length - add.length) + " waren schon vorhanden.");
  } catch (err) { say("Backup konnte nicht geladen werden: " + err.message, true); }
};
document.getElementById("btnSample").onclick = addSamples;
document.getElementById("linkSample").onclick = e => { e.preventDefault(); addSamples(); };
document.getElementById("btnClear").onclick = () => {
  if (!flights.length || !confirm("Alle gespeicherten Flüge löschen?")) return;
  flights = []; selected.clear(); save(); render(); say("Alles gelöscht.");
};
document.getElementById("file").onchange = e => { importFiles([...e.target.files]); e.target.value = ""; };

// Dateien irgendwo auf die Seite ziehen
let dragN = 0; const over = document.getElementById("over");
addEventListener("dragenter", e => { if (e.dataTransfer && [...e.dataTransfer.types].includes("Files")) { dragN++; over.classList.add("on"); } });
addEventListener("dragleave", () => { dragN = Math.max(0, dragN - 1); if (!dragN) over.classList.remove("on"); });
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", e => { e.preventDefault(); dragN = 0; over.classList.remove("on"); if (e.dataTransfer.files.length) importFiles([...e.dataTransfer.files]); });

render();
spy();
</script>
</body>
</html>
